<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Create New Order</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="author">Author Name:</label>
            <input type="text" class="form-control" id="author" name="author" placeholder="Enter your name" required>
        </div>
        <p class="text-muted">All available products will be included in this order.</p>
        <button type="submit" class="btn btn-primary mt-3">Submit Order</button>
    </form>
</div>
</body>
</html>
