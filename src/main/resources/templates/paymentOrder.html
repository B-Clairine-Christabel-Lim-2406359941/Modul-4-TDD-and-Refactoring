<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h3>Payment for Order ID: <span th:text="${orderId}"></span></h3>
        </div>
        <div class="card-body">
            <form th:action="@{'/order/pay/' + ${orderId}}" method="post">
                <div class="form-group">
                    <label for="method">Select Payment Method:</label>
                    <select class="form-control" id="method" name="paymentMethod" onchange="toggleFields()">
                        <option value="VOUCHER">Voucher Code</option>
                        <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
                    </select>
                </div>

                <div id="voucherFields" class="form-group">
                    <label for="voucherCode">Voucher Code:</label>
                    <input type="text" class="form-control" id="voucherCode" name="voucherCode"
                           placeholder="e.g. ESHOP1234ABC5678">
                </div>

                <div id="codFields" class="form-group" style="display:none;">
                    <div class="form-group">
                        <label for="address">Delivery Address:</label>
                        <input type="text" class="form-control" id="address" name="address"
                               placeholder="Enter delivery address">
                    </div>
                    <div class="form-group">
                        <label for="deliveryFee">Delivery Fee:</label>
                        <input type="text" class="form-control" id="deliveryFee" name="deliveryFee"
                               placeholder="Enter delivery fee">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Submit Payment</button>
            </form>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        var method = document.getElementById('method').value;
        document.getElementById('voucherFields').style.display = (method === 'VOUCHER') ? 'block' : 'none';
        document.getElementById('codFields').style.display = (method === 'CASH_ON_DELIVERY') ? 'block' : 'none';
    }
</script>
</body>
</html>
