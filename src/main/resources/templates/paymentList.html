<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Payment Management (Admin)</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="thead-dark">
        <tr>
            <th>Payment ID</th>
            <th>Method</th>
            <th>Status</th>
            <th>Order ID</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.id}"></td>
            <td th:text="${payment.method}"></td>
            <td>
                <span th:if="${payment.status == 'SUCCESS'}" class="badge badge-success" th:text="${payment.status}"></span>
                <span th:if="${payment.status == 'REJECTED'}" class="badge badge-danger" th:text="${payment.status}"></span>
                <span th:if="${payment.status != 'SUCCESS' and payment.status != 'REJECTED'}" class="badge badge-warning" th:text="${payment.status}"></span>
            </td>
            <td th:text="${payment.order.id}"></td>
            <td>
                <a th:href="@{'/payment/admin/detail/' + ${payment.id}}" class="btn btn-sm btn-info">Detail</a>
                <form th:action="@{'/payment/admin/set-status/' + ${payment.id}}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="SUCCESS">
                    <button type="submit" class="btn btn-sm btn-success">Approve</button>
                </form>
                <form th:action="@{'/payment/admin/set-status/' + ${payment.id}}" method="post" class="d-inline">
                    <input type="hidden" name="status" value="REJECTED">
                    <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(payments)}" class="alert alert-info">
        No payments found.
    </div>
</div>
</body>
</html>
