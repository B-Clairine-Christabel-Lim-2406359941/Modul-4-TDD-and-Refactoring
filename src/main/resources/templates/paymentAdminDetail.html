<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Payment Admin Detail</h2>

    <div th:if="${payment != null}" class="card">
        <div class="card-header bg-dark text-white">
            <h4>Payment ID: <span th:text="${payment.id}"></span></h4>
        </div>
        <div class="card-body">
            <p><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
            <p><strong>Status:</strong>
                <span th:if="${payment.status == 'SUCCESS'}" class="badge badge-success" th:text="${payment.status}"></span>
                <span th:if="${payment.status == 'REJECTED'}" class="badge badge-danger" th:text="${payment.status}"></span>
                <span th:if="${payment.status != 'SUCCESS' and payment.status != 'REJECTED'}" class="badge badge-warning" th:text="${payment.status}"></span>
            </p>
            <p><strong>Order ID:</strong> <span th:text="${payment.order.id}"></span></p>

            <h5 class="mt-3">Payment Data:</h5>
            <table class="table table-bordered">
                <tbody>
                <tr th:each="entry : ${payment.paymentData}">
                    <td th:text="${entry.key}"></td>
                    <td th:text="${entry.value}"></td>
                </tr>
                </tbody>
            </table>

            <hr>
            <h5>Set Payment Status:</h5>
            <form th:action="@{'/payment/admin/set-status/' + ${payment.id}}" method="post" class="d-inline">
                <input type="hidden" name="status" value="SUCCESS">
                <button type="submit" class="btn btn-success">Approve</button>
            </form>
            <form th:action="@{'/payment/admin/set-status/' + ${payment.id}}" method="post" class="d-inline">
                <input type="hidden" name="status" value="REJECTED">
                <button type="submit" class="btn btn-danger">Reject</button>
            </form>
        </div>
    </div>

    <div th:if="${payment == null}" class="alert alert-warning">
        Payment not found for ID: <span th:text="${paymentId}"></span>
    </div>

    <a href="/payment/admin/list" class="btn btn-secondary mt-3">Back to Payment List</a>
</div>
</body>
</html>
