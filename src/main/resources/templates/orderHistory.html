<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Order History</h2>

    <form th:action="@{/order/history}" method="post" class="mb-4">
        <div class="form-group">
            <label for="author">Input your name to see order history:</label>
            <input type="text" class="form-control" id="author" name="author" placeholder="e.g. clairine.christabel" required>
        </div>
        <button type="submit" class="btn btn-info mt-2">Check History</button>
    </form>

    <hr>

    <div th:if="${orders != null}">
        <h3>Results for: <span th:text="${author}"></span></h3>
        <table class="table table-striped mt-3">
            <thead class="thead-dark">
            <tr>
                <th>Order ID</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.status}"></td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-warning">
            No orders found for this name.
        </div>
    </div>
</div>
</body>
</html>
